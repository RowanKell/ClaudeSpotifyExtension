<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Controller</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Authentication Section -->
    <div id="auth-section" class="auth-section">
      <h2>Spotify Controller</h2>
      <p>Connect to your Spotify account to control playback</p>
      <button id="login-btn" class="login-btn">Connect to Spotify</button>
    </div>

    <!-- Player Section -->
    <div id="player-section" class="player-section hidden">
      <!-- Album Art -->
      <div class="album-art-container">
        <img id="album-art" src="" alt="Album Art" class="album-art">
        <div id="no-playback" class="no-playback hidden">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <p>No active playback</p>
        </div>
      </div>

      <!-- Track Info -->
      <div class="track-info">
        <div id="track-name" class="track-name">Not Playing</div>
        <div id="artist-name" class="artist-name">-</div>
      </div>

      <!-- Playback Controls -->
      <div class="controls">
        <button id="prev-btn" class="control-btn" title="Previous track">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
          </svg>
        </button>

        <button id="play-pause-btn" class="control-btn play-btn" title="Play/Pause">
          <svg id="play-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="pause-icon" class="hidden" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
          </svg>
        </button>

        <button id="next-btn" class="control-btn" title="Next track">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M16 6h2v12h-2zM6 6v12l8.5-6z"/>
          </svg>
        </button>
      </div>

      <!-- Secondary Controls -->
      <div class="secondary-controls">
        <button id="playlist-btn" class="icon-btn" title="Browse playlists">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/>
          </svg>
        </button>
        <button id="queue-btn" class="icon-btn" title="View queue">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zm0 4H3v2h12v-2zM3 18h8v-2H3v2zm18-12v2h-2V6h2zM19 10h2v2h-2v-2zm2 4h-2v2h2v-2zm-2 4h2v2h-2v-2z"/>
          </svg>
        </button>
        <button id="shuffle-btn" class="icon-btn" title="Toggle shuffle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
          </svg>
        </button>
      </div>

      <!-- Logout -->
      <div class="footer">
        <button id="logout-btn" class="logout-btn">Disconnect</button>
      </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>

    <!-- Error Message -->
    <div id="error-message" class="error-message hidden"></div>

    <!-- Playlist Modal -->
    <div id="playlist-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Your Playlists</h3>
          <button id="close-modal-btn" class="close-btn">&times;</button>
        </div>
        <div id="playlist-list" class="playlist-list">
          <div class="playlist-loading">
            <div class="spinner"></div>
            <p>Loading playlists...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Queue Modal -->
    <div id="queue-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Queue</h3>
          <button id="close-queue-modal-btn" class="close-btn">&times;</button>
        </div>
        <div id="queue-list" class="queue-list">
          <div class="playlist-loading">
            <div class="spinner"></div>
            <p>Loading queue...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
